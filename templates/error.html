{% extends '_shell.html' %}
{% block title %}Algo falló · ProFoot{% endblock %}
{% block hero %}{% endblock %}

{% block content %}
<div style="max-width:400px;margin:0 auto;padding:calc(60px + env(safe-area-inset-top,0px)) 24px 40px;
            text-align:center">
  <div style="width:80px;height:80px;border-radius:40px;background:var(--warning-bg);
              color:var(--warning);display:flex;align-items:center;justify-content:center;
              margin:0 auto 20px">
    <i data-ico="alert-triangle" class="pf-ico--xxl"></i>
  </div>

  <h1 style="font-size:23px;font-weight:800;letter-spacing:-.4px;margin:0 0 10px">
    Algo se rompió por aquí
  </h1>
  <p style="font-size:15px;color:var(--text-sec);line-height:1.6;margin:0 0 26px">
    No es culpa tuya. Ya quedó registrado y lo estamos mirando.
    Vuelve a intentarlo en un momento.
  </p>

  <a class="pf-btn pf-btn--primary pf-btn--block" href="{{ url_for('index') }}">
    Volver al inicio
  </a>
</div>
{% endblock %}
